<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exercice 1 – Manipulation du DOM</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Syne', sans-serif;
      background: #0d0d0d;
      color: #f0ece4;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    h1 {
      font-family: 'Space Mono', monospace;
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      letter-spacing: 0.08em;
      color: #c8ff00;
      text-transform: uppercase;
      border-bottom: 2px solid #c8ff00;
      padding-bottom: 0.4rem;
    }

    /* La div créée par JS */
    #ma-div {
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 12px;
      padding: 2rem 2.5rem;
      cursor: pointer;
      transition: border-color 0.2s, transform 0.15s;
      max-width: 480px;
      width: 100%;
    }

    #ma-div:hover {
      border-color: #c8ff00;
      transform: translateY(-2px);
    }

    #ma-div p {
      font-family: 'Space Mono', monospace;
      font-size: 0.95rem;
      background: lightblue;
      color: #1a1a1a;
      text-align: center;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      transition: background 0.3s;
    }

    .hint {
      font-size: 0.78rem;
      color: #555;
      font-family: 'Space Mono', monospace;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Exercice 1 — Manipulation du DOM</h1>
  <p class="hint">← cliquez sur le bloc ci-dessous →</p>
  <script src="script.js"></script>
</body>
</html>
